<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Python Library</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background: #1e1e2f;
      color: white;
      padding: 15px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 18px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .category {
      margin-top: 15px;
    }

    .file {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #ccc;
    }

    .file:hover {
      color: white;
    }

    /* Main content */
    #main {
      flex: 1;
      padding: 20px;
      background: #f5f5f5;
      overflow-y: auto;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 15px;
      overflow-x: auto;
      border-radius: 8px;
    }

    h1 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div id="sidebar">
  <h1>Modules</h1>
  <div id="categories"></div>
</div>

<div id="main">
  <h1>Welcome</h1>
  <p>Select a file from the left.</p>
  <pre id="code"></pre>
</div>

<script>
const repo = "YOUR_USERNAME/YOUR_REPO";

// Change this if your code is inside /code
const basePath = "code";

async function fetchDir(path) {
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
  return res.json();
}

async function loadCategories() {
  const categoriesDiv = document.getElementById("categories");

  const folders = await fetchDir(basePath);

  for (const folder of folders) {
    if (folder.type !== "dir") continue;

    const categoryDiv = document.createElement("div");
    categoryDiv.className = "category";

    const title = document.createElement("h2");
    title.textContent = folder.name;
    categoryDiv.appendChild(title);

    const files = await fetchDir(folder.path);

    files
      .filter(f => f.name.endsWith(".py"))
      .forEach(file => {
        const fileEl = document.createElement("div");
        fileEl.className = "file";
        fileEl.textContent = file.name;

        fileEl.onclick = async () => {
          const res = await fetch(file.download_url);
          const code = await res.text();

          document.getElementById("code").textContent = code;
          document.querySelector("#main h1").textContent = file.name;
        };

        categoryDiv.appendChild(fileEl);
      });

    categoriesDiv.appendChild(categoryDiv);
  }
}

loadCategories();
</script>

</body>
</html>
