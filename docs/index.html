<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Python Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="sidebar">
  <h1>Modules</h1>
  <p class="subtitle">Browse the EPHEC Python library by category and inspect each module directly in your browser.</p>
  <div id="categories"></div>
</div>

<div id="main">
  <h1>Welcome</h1>
  <p class="intro">Select a file from the left to view its summary and source.</p>
  <p id="code-meta">No file selected</p>
  <div id="description" class="markdown">
    <p>Select a module from the sidebar to load its documentation.</p>
  </div>
  <details id="code-panel">
    <summary>Source code</summary>
    <pre id="code"></pre>
  </details>
</div>

<script src="script.js"></script>

</body>
</html>
