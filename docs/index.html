<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Python Library</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background: #1e1e2f;
      color: white;
      padding: 15px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 18px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .category {
      margin-top: 15px;
    }

    .file {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #ccc;
    }

    .file:hover {
      color: white;
    }

    /* Main content */
    #main {
      flex: 1;
      padding: 20px;
      background: #f5f5f5;
      overflow-y: auto;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 15px;
      overflow-x: auto;
      border-radius: 8px;
    }

    h1 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div id="sidebar">
  <h1>Modules</h1>
  <div id="categories"></div>
</div>

<div id="main">
  <h1>Welcome</h1>
  <p>Select a file from the left.</p>
  <pre id="code"></pre>
</div>

<script>
async function loadCategories() {
  const res = await fetch("files.json");
  const data = await res.json();

  const categoriesDiv = document.getElementById("categories");

  for (const category in data) {
    const categoryDiv = document.createElement("div");
    categoryDiv.className = "category";

    const title = document.createElement("h2");
    title.textContent = category;
    categoryDiv.appendChild(title);

    data[category].forEach(file => {
      const fileEl = document.createElement("div");
      fileEl.className = "file";
      fileEl.textContent = file.name;

      fileEl.onclick = () => {
        document.getElementById("code").textContent = file.content;
        document.querySelector("#main h1").textContent = file.name;
      };

      categoryDiv.appendChild(fileEl);
    });

    categoriesDiv.appendChild(categoryDiv);
  }
}

loadCategories();
</script>

</body>
</html>
